# Mijn onderwerp: Maroua's World

Mijn digital garden wordt een persoonlijke wereld waarin ik mijn interesses verzamel.

- Muziek: mijn favoriete artiesten en albums
- Films & series: verhalen die mij aanspreken
- Boeken: wat ik lees en mijn favorieten
- Games: games die ik graag speel
- Andere interesses: alles wat ik later wil toevoegen

Ik wil mijn website vormgeven met een nostalgische 80s/90s sfeer, geïnspireerd op VHS, pixelgames en oude computers.
---

# 10 inspiratielinks

Voor mijn digital garden heb ik inspiratiebronnen
geselecteerd rondom retro websites, pixel-art
en persoonlijke online werelden.

- [Neocities – 90s](https://neocities.org/browse?tag=90s)
- [MelonKing](https://melonking.net/)
- [PurpleHello98](https://purplehello98.neocities.org/)
- [Neocities – Retro](https://neocities.org/browse?tag=retro)
- [Neocities – Retroweb](https://neocities.org/browse?tag=retroweb)
- [Internet Archive – DOS Games](https://archive.org/details/softwarelibrary_msdos_games)
- [GifCities](https://gifcities.org/)
- [88x31 GIF Database](https://88x31db.com/)
- [Neocities – Old Web](https://neocities.org/browse?tag=oldweb)
- [90s.land](https://90s.land/webring/)
---

# Mijn visuele inspiratie

Ik verzamel 50 afbeeldingen die passen bij
de nostalgische sfeer van Maroua's World.

Wat steeds terugkomt:

- Retro technologie uit de jaren 80 en 90
- VHS, cassettes en oude computerschermen
- Pixel-art en videogames
- Persoonlijke verzamelingen en herinneringen

Ik wil deze elementen combineren tot
een interactieve digitale wereld.

# Introtekst

Maroua's World is mijn persoonlijke digitale wereld
vol muziek, films, boeken en games. Een nostalgische
plek geïnspireerd op de jaren 80 en 90, VHS en
pixelgames.

## Hoe wil ik dit vertellen?

Met persoonlijke verhalen, afbeeldingen,
interactieve elementen en verzamelingen
van mijn favoriete dingen.
