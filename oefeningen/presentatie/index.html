# Maroua's World ♡

### My personal corner of the internet

Een persoonlijke Digital Garden geïnspireerd
op de internetcultuur van de jaren 2000.

Maroua | CMD Jaar 2
---

3. Mijn interesses

# Mijn concept: Maroua's World ♡

Maroua's World wordt een persoonlijke Digital Garden
waarin ik mijn interesses, herinneringen en
favoriete media verzamel.

- Muziek, films, boeken en games
- Persoonlijke verhalen en herinneringen
- Een interactieve website die met mij meegroeit

De website krijgt de uitstraling van een oude
computerdesktop uit de jaren 2000.

Bezoekers kunnen mijn wereld ontdekken door
op desktopiconen en vensters te klikken.
---

# Waarom de jaren 2000?

Mijn eerste idee was een website geïnspireerd
op de jaren 80 en 90.

Maar omdat mijn website Maroua's World heet,
wilde ik het concept persoonlijker maken.

- Ik ben geboren in 2004.
- Daarom wilde ik mijn website baseren op
  het tijdperk waarin ik ben geboren.
- De internetcultuur uit die periode spreekt
  mij aan, vooral de persoonlijke websites
  en oude computerinterfaces.

Ik combineer deze 2000s aesthetic met
mijn eigen smaak: Y2K, Gothic Glam en McBling.

---


# 10 inspiratielinks ♡

Mijn inspiratie komt uit persoonlijke websites,
oude internetinterfaces en Y2K-design.

1. [SpaceHey](https://spacehey.com/) - persoonlijke profielen
2. [Neocities](https://neocities.org/) - creatieve websites
3. [MelonLand](https://melonland.net/) - persoonlijk webdesign
4. [GifCities](https://gifcities.org/) - retro GIF-animaties
5. [88x31 GIF Database](https://88x31db.com/) - webbuttons
6. [Cameron's World](https://www.cameronsworld.net/) - oude webcultuur
7. [Windows 93](https://www.windows93.net/) - desktopinteracties
8. [Web Design Museum](https://www.webdesignmuseum.org/) - oude websites
9. [Internet Archive](https://archive.org/) - digitale nostalgie
10. [The Useless Web](https://theuselessweb.com/) - speelse interacties
---


# Wat neem ik mee uit mijn inspiratie? ♡

**Persoonlijke vormgeving**
SpaceHey, Neocities en MelonLand laten zien
hoe je een website echt eigen kunt maken.

**Navigatie en interactie**
Windows 93 inspireert mijn desktopiconen
en vensters. The Useless Web laat zien
hoe interacties speels kunnen zijn.

**Visuele details**
GifCities en 88x31db inspireren kleine
GIFs, buttons en decoraties.

**Internetgeschiedenis**
Cameron's World, Web Design Museum en
Internet Archive helpen mij de oude
internetstijl beter te begrijpen.

Mijn doel: een persoonlijke website met
een nostalgische uitstraling, maar
wel overzichtelijk en leesbaar.

---

# Mijn homepage: Maroua's World ♡

Mijn homepage wordt een interactieve
desktop geïnspireerd op de jaren 2000.

- Achtergrond: donker bordeauxrood met
  een subtiel sierlijk patroon.
- Titel: roze, gotische letters met glitter.
- Navigatie: desktopiconen voor mijn interesses.
- Vensters: roze pop-ups met informatie,
  afbeeldingen en persoonlijke verhalen.
- Extra details: hartjes, vlinders,
  een muziekspeler en kleine animaties.

Ik wil een nostalgische en persoonlijke
uitstraling creëren, zonder dat de
homepage te druk wordt.
---

# Ontdek Maroua's World ♡

Bezoekers kunnen via desktopiconen
verschillende onderdelen openen.

- About Me: wie ik ben en wat ik leuk vind.
- My Music: favoriete artiesten en albums.
- My Movies: films en series.
- My Books: boeken die ik heb gelezen.
- My Games: favoriete videogames.

# Interacties

Door op een icoon te klikken, opent een
venster met de bijbehorende inhoud.

Later wil ik experimenteren met een
muziekspeler, animaties en vensters
die je kunt verplaatsen.

---
# Mijn visuele inspiratie ♡

Voor Maroua's World combineer ik verschillende
stijlen uit de jaren 2000.

- Y2K: oude Windows-vensters, desktopiconen
  en persoonlijke websites.
- Gothic Glam: gotische letters, donkere
  kleuren en sierlijke patronen.
- McBling: roze, glitters en glanzende details.
- Dark Feminine: kant, hartjes en vlinders.

Ik wil deze stijlen combineren tot een
persoonlijke, nostalgische digitale wereld.
